# Pages CMS configuration: https://pagescms.org/docs/configuration/
#
# Media
#   - "images" are uploaded to public/images and are optimized at build time by
#     next-image-export-optimizer (resized WebP versions are generated by `yarn build`).
#     Use these for anything rendered with <ExportedImage>.
#   - "logos" are uploaded to public/logos and are served as-is (not optimized).
#
# Content
#   - zones:    one JSON file per zone in content/zones (loaded by src/data/zones.ts)
#   - sponsors: content/sponsors.json (loaded by src/data/sponsors.ts)

media:
  - name: images
    label: Images (optimized)
    input: public/images
    output: /images
    rename: safe
    extensions: [jpg, jpeg, png, webp, avif, gif]
  - name: logos
    label: Logos
    input: public/logos
    output: /logos
    rename: safe
    extensions: [svg, png, jpg, jpeg, webp]

content:
  - name: zones
    label: Zones
    type: collection
    path: content/zones
    format: json
    filename: "{fields.slug}.json"
    view:
      primary: name
      fields: [name, slug, order]
      sort: [order, name]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        description: URL of the zone page (e.g. "woodworking" → /woodworking). Lowercase letters, numbers and dashes only.
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: Use lowercase letters, numbers and dashes only.
      - name: order
        label: Display order
        type: number
        required: true
        description: Zones are listed in ascending order on the home page and in the navigation menu.
      - name: description
        label: Description
        type: text
        required: true
      - name: color
        label: Accent color
        type: string
        required: true
        description: Hex color, e.g. "#d53e4f".
        pattern:
          regex: "^#[0-9a-fA-F]{6}$"
          message: Use a 6-digit hex color such as #d53e4f.
      - name: image
        label: Card / banner image
        type: image
        options:
          media: images
        required: true
      - name: facilityImages
        label: Facility images
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.altText}"
        fields:
          - name: imageSrc
            label: Image
            type: image
            options:
              media: images
            required: true
          - name: altText
            label: Alt text
            type: string
            required: true
      - name: benefits
        label: Benefits
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: image
            label: Image
            type: image
            options:
              media: images
            required: true
          - name: description
            label: Description
            type: text
            required: true
          - name: footnote
            label: Footnote
            type: text
            description: Optional. Shown below the description (add a "*" to the description to reference it).
      - name: tools
        label: Tools
        type: string
        list: true
        description: Optional. Leave empty to hide the Tools section.

  - name: sponsors
    label: Sponsors
    type: file
    path: content/sponsors.json
    format: json
    fields:
      - name: sponsors
        label: Current sponsors
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: url
            label: Website
            type: string
            required: true
          - name: image
            label: Logo
            type: image
            options:
              media: logos
            required: true
          - name: tier
            label: Tier
            type: select
            required: true
            options:
              values: [platinum, gold, silver, bronze]
          - name: amount
            label: Amount
            type: number
            required: true
      - name: pastSponsors
        label: Past sponsors
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name} ({fields.year})"
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: image
            label: Logo
            type: image
            options:
              media: logos
            description: Optional. Sponsors with a logo are shown in the logo marquee.
          - name: url
            label: Website
            type: string
          - name: amount
            label: Amount
            type: number
            required: true
          - name: year
            label: Year
            type: number
            required: true
      - name: otherSupport
        label: Other support
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: image
            label: Logo
            type: image
            options:
              media: logos
            description: Optional. Supporters with a logo are shown in the logo marquee.
