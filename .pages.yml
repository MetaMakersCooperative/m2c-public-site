# Pages CMS configuration: https://pagescms.org/docs/configuration/
#
# Media
#   - "images" are uploaded to public/images and are optimized at build time by
#     next-image-export-optimizer (resized WebP versions are generated by `yarn build`).
#     Use these for anything rendered with <ExportedImage>.
#   - "logos" are uploaded to public/logos and are served as-is (not optimized).
#
# Content
#   - zones:    one JSON file per zone in content/zones (loaded by src/data/zones.ts)
#   - sponsors: content/sponsors.json (loaded by src/data/sponsors.ts)
#   - faq:      content/faq.json (loaded by src/data/faq.ts)
#   - events:   one JSON file per class/event in content/events (loaded by src/data/events.ts)

media:
  - name: images
    label: Images (optimized)
    input: public/images
    output: /images
    rename: safe
    extensions: [jpg, jpeg, png, webp, avif, gif]
  - name: logos
    label: Logos
    input: public/logos
    output: /logos
    rename: safe
    extensions: [svg, png, jpg, jpeg, webp]

content:
  - name: zones
    label: Zones
    type: collection
    path: content/zones
    format: json
    filename: "{fields.slug}.json"
    view:
      primary: name
      fields: [name, slug, order]
      sort: [order, name]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        description: URL of the zone page (e.g. "woodworking" → /woodworking). Lowercase letters, numbers and dashes only.
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: Use lowercase letters, numbers and dashes only.
      - name: order
        label: Display order
        type: number
        required: true
        description: Zones are listed in ascending order on the home page and in the navigation menu.
      - name: description
        label: Description
        type: text
        required: true
      - name: color
        label: Accent color
        type: string
        required: true
        description: Hex color, e.g. "#d53e4f".
        pattern:
          regex: "^#[0-9a-fA-F]{6}$"
          message: Use a 6-digit hex color such as #d53e4f.
      - name: image
        label: Card / banner image
        type: image
        options:
          media: images
        required: true
      - name: facilityImages
        label: Facility images
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.altText}"
        fields:
          - name: imageSrc
            label: Image
            type: image
            options:
              media: images
            required: true
          - name: altText
            label: Alt text
            type: string
            required: true
      - name: benefits
        label: Benefits
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: image
            label: Image
            type: image
            options:
              media: images
            required: true
          - name: description
            label: Description
            type: text
            required: true
          - name: footnote
            label: Footnote
            type: text
            description: Optional. Shown below the description (add a "*" to the description to reference it).
      - name: tools
        label: Tools
        type: string
        list: true
        description: Optional. Leave empty to hide the Tools section.

  - name: sponsors
    label: Sponsors
    type: file
    path: content/sponsors.json
    format: json
    fields:
      - name: sponsors
        label: Current sponsors
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: url
            label: Website
            type: string
            required: true
          - name: image
            label: Logo
            type: image
            options:
              media: logos
            required: true
          - name: tier
            label: Tier
            type: select
            required: true
            options:
              values: [platinum, gold, silver, bronze]
          - name: amount
            label: Amount
            type: number
            required: true
      - name: pastSponsors
        label: Past sponsors
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name} ({fields.year})"
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: image
            label: Logo
            type: image
            options:
              media: logos
            description: Optional. Sponsors with a logo are shown in the logo marquee.
          - name: url
            label: Website
            type: string
          - name: amount
            label: Amount
            type: number
            required: true
          - name: year
            label: Year
            type: number
            required: true
      - name: otherSupport
        label: Other support
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.name}"
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: image
            label: Logo
            type: image
            options:
              media: logos
            description: Optional. Supporters with a logo are shown in the logo marquee.

  - name: faq
    label: FAQ
    type: file
    path: content/faq.json
    format: json
    list: true
    description: Questions are shown in this order on the FAQ page. Featured questions are also shown on the Contact page. Each question's link (e.g. /faq#how-do-i-become-a-member) is based on its wording, so rewording a question changes its link.
    fields:
      - name: question
        label: Question
        type: string
        required: true
      - name: answer
        label: Answer
        type: rich-text
        required: true
        options:
          format: html
          media: images
      - name: featured
        label: Featured
        type: boolean
        default: false
        description: Show this question on the Contact page.

  - name: events
    label: Classes & Events
    type: collection
    path: content/events
    format: json
    filename: "{fields.slug}.json"
    description: Upcoming classes and events are shown on the Classes page, the home page and the matching zone pages. Once an event is over it moves to "Past Classes & Events" — add photos and a recap afterwards.
    view:
      primary: title
      fields: [title, date, type, soldOut]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        description: URL of the event page (e.g. "intro-to-woodturning-2026" → /events/intro-to-woodturning-2026). Lowercase letters, numbers and dashes only. Must be unique, so consider adding the month or year.
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: Use lowercase letters, numbers and dashes only.
      - name: type
        label: Type
        type: select
        required: true
        default: class
        options:
          values:
            - name: class
              label: Class
            - name: event
              label: Event
      - name: description
        label: Short description
        type: text
        required: true
        description: One or two sentences shown on the event card and page.
      - name: image
        label: Card / banner image
        type: image
        required: true
        options:
          media: images
      - name: date
        label: Date & start time
        type: date
        required: true
        default: ""
        description: Local (Windsor) time of the first session.
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: duration
        label: Duration (hours)
        type: number
        required: true
        default: 2
        description: Length of each session in hours, e.g. 1.5 for 90 minutes.
        options:
          min: 0.25
      - name: additionalSessions
        label: Additional sessions
        type: object
        description: Optional. For classes with more than one session, add the dates after the first one. The class shows as "in progress" from the first session until the last one ends.
        list:
          collapsible:
            collapsed: true
            summary: "{fields.date}"
        fields:
          - name: date
            label: Date & start time
            type: date
            required: true
            default: ""
            options:
              time: true
              format: yyyy-MM-dd'T'HH:mm
          - name: duration
            label: Duration (hours)
            type: number
            description: Optional. Leave empty to use the main duration.
            options:
              min: 0.25
      - name: price
        label: Price
        type: number
        description: Optional. Regular (non-member) price in dollars. Leave empty or 0 for a free event.
        options:
          min: 0
      - name: memberPrice
        label: Member price
        type: number
        description: Optional. Discounted price for members. The savings are shown when it's lower than the regular price.
        options:
          min: 0
      - name: zeffyUrl
        label: Zeffy URL
        type: string
        description: Link to the Zeffy ticketing form, e.g. https://www.zeffy.com/en-CA/ticketing/my-class. Registration is embedded on the event page while the event is upcoming and not sold out.
      - name: soldOut
        label: Sold out
        type: boolean
        default: false
        description: Disables registration and marks the event as sold out.
      - name: zones
        label: Zones
        type: reference
        description: Optional. The event is also shown on these zone pages.
        options:
          collection: zones
          multiple: true
          search: name
          value: "{fields.slug}"
          label: "{fields.name}"
      - name: photos
        label: Event photos
        type: object
        description: Optional. Photos taken at the event, shown in the gallery once it's over.
        list:
          collapsible:
            collapsed: true
            summary: "{fields.altText}"
        fields:
          - name: imageSrc
            label: Image
            type: image
            required: true
            options:
              media: images
          - name: altText
            label: Alt text
            type: string
            description: Optional. A short description of the photo for screen readers.
      - name: blog
        label: Recap / blog
        type: rich-text
        description: Optional. Write about how the event went. Shown on the event page once it's over.
        options:
          format: html
          media: images
